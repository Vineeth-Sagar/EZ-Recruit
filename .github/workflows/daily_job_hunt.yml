name: 🤖 OpportunityBot — Daily Job Hunt

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

jobs:
  hunt-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # ── 1. Checkout repo ────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Python ────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ─────────────────────────────
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Restore seen-jobs dedup DB ────────────────────────
      # This used to be committed to git on every run, growing the repo's
      # history forever with a binary diff nobody reads. It's ephemeral
      # working state, not source — a rolling Actions cache is the right
      # place for it. restore-keys falls back to the most recent cache;
      # the unique `key` (run id) guarantees a "miss" so the cache action
      # always saves a fresh copy back at the end of the job.
      - name: 💾 Restore seen-jobs cache
        uses: actions/cache@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      # ── 5. Run the bot ──────────────────────────────────────
      - name: 🚀 Run OpportunityBot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT:             ${{ secrets.GH_PAT }}
          SERPAPI_API_KEY:    ${{ secrets.SERPAPI_API_KEY }}
        run: python job_hunter/main.py

      # ── 6. Commit updated report + resume-parse cache ───────
      # config.json is included now because load_resume_profiles() writes
      # a resume_hash/extracted_full cache back into it to skip re-parsing
      # an unchanged resume on the next run. seen_jobs.db is intentionally
      # NOT committed — see the cache step above.
      - name: 📤 Commit updated data
        if: always()
        run: |
          git config user.name  "OpportunityBot"
          git config user.email "bot@opportunitybot.local"
          git add config.json data/reports/ || true
          git diff --cached --quiet || git commit -m "🤖 Bot run: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
